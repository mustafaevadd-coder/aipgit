<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Шашлык</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #333; }
        p { color: #666; }
        .badge {
            display: inline-block;
            background: #6c63ff;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Мустафаева Динара</h1>
        <p>Группа: И-2-25</p>
        <p>Тема: Шашлык</p>
        <div class="badge">{{STATUS}}</div>
    </div>
</body>
</html>
